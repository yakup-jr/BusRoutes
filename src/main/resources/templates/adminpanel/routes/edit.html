<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Edit route</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
<section th:fragment="edit-route(route)"
         class="min-h-screen bg-slate-50 p-8 font-sans flex items-center justify-center">
    <div class="w-full max-w-md overflow-hidden rounded-xl border border-[#00bcff]/20 bg-white shadow-2xl">

        <div class="bg-[#00bcff] px-6 py-4">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2"
                     stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/>
                </svg>
                Edit Route Details
            </h3>
            <p class="text-xs text-blue-50 mt-0.5">Update route info</p>
        </div>

        <form th:action="@{|${route.id}|}"
              th:method="post"
              th:object="${updateRouteDto}"
              class="p-6 space-y-5">

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">
                    Route Name
                </label>
                <input
                        th:field="*{name}"
                        type="text"
                        placeholder="e.g. Central Station"
                        class="w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm text-slate-700 outline-none transition-all focus:border-[#00bcff] focus:ring-2 focus:ring-[#00bcff]/20"
                />
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">
                        Type
                    </label>
                    <div class="relative">
                        <input
                                th:field="*{type}"
                                type="text"
                                class="w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm font-mono text-slate-600 outline-none transition-all focus:border-[#00bcff] focus:ring-2 focus:ring-[#00bcff]/20"
                        />
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">
                        Interval - minutes
                    </label>
                    <div class="relative">
                        <input
                                th:field="*{interval}"
                                type="number"
                                placeholder="-74.0060"
                                class="w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm font-mono text-slate-600 outline-none transition-all focus:border-[#00bcff] focus:ring-2 focus:ring-[#00bcff]/20"
                        />
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">
                        Start at
                    </label>
                    <div class="relative">
                        <input
                                th:field="*{businessHours.startAt}"
                                type="time"
                                placeholder="-74.0060"
                                class="w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm font-mono text-slate-600 outline-none transition-all focus:border-[#00bcff] focus:ring-2 focus:ring-[#00bcff]/20"
                        />
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">
                        End at
                    </label>
                    <div class="relative">
                        <input
                                th:field="*{businessHours.endAt}"
                                type="time"
                                placeholder="-74.0060"
                                class="w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm font-mono text-slate-600 outline-none transition-all focus:border-[#00bcff] focus:ring-2 focus:ring-[#00bcff]/20"
                        />
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">
                    Stops
                </label>
                <div id="stops-container" class="flex flex-col mb-4 gap-3">
                    <div class="relative group stop-row border-b border-slate-100 pb-3 last:border-0"
                         th:each="stop, counter : ${updateRouteDto.stops}">

                        <input type="hidden"
                               th:field="*{stops[__${counter.index}__].stopOrder}"
                               class="row-order-input"/>

                        <div class="flex flex-col gap-2">
                            <div class="flex items-center gap-2">
                <span class="text-slate-400 font-mono text-xs row-number"
                      th:text="${counter.count}+'.'">1.</span>

                                <div class="relative flex-1">
                                    <input
                                            th:field="*{stops[__${counter.index}__].stopName}"
                                            type="text"
                                            autocomplete="off"
                                            oninput="searchStops(this)"
                                            placeholder="Stop Name"
                                            class="stop-input w-full rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-700 outline-none transition-all focus:border-[#00bcff] focus:ring-2 focus:ring-[#00bcff]/20"
                                    />
                                    <div class="search-results absolute z-20 w-full mt-1 hidden max-h-48 overflow-y-auto rounded-lg border border-slate-200 bg-white shadow-xl"></div>
                                </div>

                                <div class="w-24">
                                    <input
                                            th:field="*{stops[__${counter.index}__].arriveAtFromStart}"
                                            type="number"
                                            placeholder="Secs"
                                            title="Arrival time from start in seconds"
                                            class="w-full rounded-lg border border-slate-200 bg-slate-50 px-2 py-2 text-sm font-mono text-slate-600 outline-none focus:border-[#00bcff]"
                                    />
                                </div>

                                <button type="button" onclick="removeStop(this)"
                                        class="text-slate-300 hover:text-red-500 transition-colors">
                                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                                         stroke="currentColor">
                                        <path stroke-linecap="round"
                                              stroke-linejoin="round" stroke-width="2"
                                              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    <button type="button" onclick="addStopRow()"
                            class="flex items-center gap-1 text-xs font-bold text-[#00bcff] hover:text-[#0088cc] transition-colors uppercase tracking-wider mt-2">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                             stroke="currentColor" stroke-width="3">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M12 4.5v15m7.5-7.5h-15"/>
                        </svg>
                        Add Stop
                    </button>
                </div>
            </div>

            <div class="mt-8 flex items-center justify-end gap-3 pt-2">
                <a th:href="@{http://localhost:8080/adminpanel/routes}">
                    <button type="button"
                            class="px-4 py-2 text-sm font-semibold text-[#b34925] hover:bg-[#b34925]/5 rounded-lg transition-colors">
                        Discard
                    </button>
                </a>

                <button
                        type="submit"
                        class="rounded-lg bg-[#ff6800] px-6 py-2 text-sm font-bold text-white shadow-md shadow-[#ff6800]/20 hover:bg-[#b34925] focus:outline-none focus:ring-2 focus:ring-[#ff6800] transition-all active:scale-95">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</section>
<script src="/_js/route-edit.js" defer></script>
</body>
</html>
