<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Edit stop</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
<section th:fragment="edit-stop(stop)"
         class="min-h-screen bg-slate-50 p-8 font-sans flex items-center justify-center">
    <div class="w-full max-w-md overflow-hidden rounded-xl border border-[#00bcff]/20 bg-white shadow-2xl">

        <div class="bg-[#00bcff] px-6 py-4">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2"
                     stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/>
                </svg>
                Edit Stop Details
            </h3>
            <p class="text-xs text-blue-50 mt-0.5">Update geographic coordinates and stop
                naming.</p>
        </div>

        <form class="p-6 space-y-5"
              th:action="@{/adminpanel/stops/edit/{name}(name=${stopName})}"
              th:method="put"
              th:object="${stopDto}">

            <div th:if="${#fields.hasAnyErrors()}"
                 class="mx-6 mt-4 flex items-start gap-3 rounded-lg border border-red-200 bg-red-50 p-4 animate-in fade-in slide-in-from-top-2">
                <div class="shrink-0 text-red-500">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2"
                         stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
                    </svg>
                </div>
                <div>
                    <h5 class="text-sm font-bold text-red-800">Validation Error</h5>
                    <ul class="mt-1 list-disc list-inside text-xs text-red-700 space-y-1">
                        <li th:each="err : ${#fields.allErrors()}" th:text="${err}">Error
                            message here
                        </li>
                    </ul>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">
                    Stop Name
                </label>
                <input
                        th:field="*{name}"
                        type="text"
                        placeholder="e.g. Central Station"
                        class="w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm text-slate-700 outline-none transition-all focus:border-[#00bcff] focus:ring-2 focus:ring-[#00bcff]/20"
                />
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">
                        Latitude
                    </label>
                    <div class="relative">
                        <input
                                th:field="*{coordinates.latitude}"
                                type="text"
                                placeholder="40.7128"
                                class="w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm font-mono text-slate-600 outline-none transition-all focus:border-[#00bcff] focus:ring-2 focus:ring-[#00bcff]/20"
                        />
                        <span class="absolute right-3 top-2.5 text-slate-300">°N</span>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">
                        Longitude
                    </label>
                    <div class="relative">
                        <input
                                th:field="*{coordinates.longitude}"
                                type="text"
                                placeholder="-74.0060"
                                class="w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm font-mono text-slate-600 outline-none transition-all focus:border-[#00bcff] focus:ring-2 focus:ring-[#00bcff]/20"
                        />
                        <span class="absolute right-3 top-2.5 text-slate-300">°W</span>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex items-center justify-end gap-3 pt-2">
                <a th:href="@{http://localhost:8080/adminpanel/stops}">
                    <button type="button"
                            class="px-4 py-2 text-sm font-semibold text-[#b34925] hover:bg-[#b34925]/5 rounded-lg transition-colors">
                        Discard
                    </button>
                </a>

                <button
                        type="submit"
                        class="rounded-lg bg-[#ff6800] px-6 py-2 text-sm font-bold text-white shadow-md shadow-[#ff6800]/20 hover:bg-[#b34925] focus:outline-none focus:ring-2 focus:ring-[#ff6800] transition-all active:scale-95">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</section>
</body>
</html>
