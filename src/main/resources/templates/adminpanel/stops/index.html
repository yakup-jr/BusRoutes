<!DOCTYPE html>
<html lang="en" class="h-100" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{adminpanel/fragments/head-fragment :: headFragment('Stops - Adminpanel - List of stops')}">
</head>
<body class="d-flex flex-column h-100">
<header></header>
<nav th:replace="~{/adminpanel/fragments/layout :: header}"></nav>

<main>
    <div class="min-h-screen bg-slate-50 p-8 font-sans">
        <div class="mx-auto max-w-7xl">
            <div class="mb-6 flex items-center justify-between">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">Stop Management</h2>
                </div>
                <a href="/adminpanel/stops/create">
                    <button class="rounded-lg bg-[#ff6800] px-4 py-2 text-sm font-semibold text-white shadow-md hover:bg-[#b34925] focus:outline-none focus:ring-2 focus:ring-[#ff6800] focus:ring-offset-2 transition-colors">
                        + Add New Stop
                    </button>
                </a>
            </div>

            <div class="overflow-hidden rounded-xl border border-[#00bcff]/20 bg-white shadow-lg">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-[#00bcff]/10 text-left text-sm">

                        <thead class="bg-[#00bcff] text-white">
                        <tr>
                            <th scope="col" class="px-4 py-4 font-semibold tracking-wide">
                                ID
                            </th>
                            <th scope="col" class="px-4 py-4 font-semibold tracking-wide">
                                Name
                            </th>
                            <th scope="col" class="px-4 py-4 font-semibold tracking-wide">
                                Latitude
                            </th>
                            <th scope="col" class="px-4 py-4 font-semibold tracking-wide">
                                Longitude
                            </th>
                            <th scope="col" class="px-4 py-4 font-semibold tracking-wide">
                                Actions
                            </th>
                        </tr>
                        </thead>

                        <tbody class="divide-y divide-slate-100 bg-white">
                        <tr th:each="stop : ${stops.content}"
                            th:insert="~{adminpanel/fragments/stops-row.html :: table-row(stop=${stop}, page=${currentPage}, size=${size})}">
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div th:replace="~{/adminpanel/fragments/pagination :: pagination(${totalElements}, ${currentPage}, ${size}, ${totalPages}, ${hasPrevious}, ${hasNext}, '/adminpanel/stops')}"></div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{/adminpanel/fragments/layout :: footer}"></footer>
</body>
</html>
