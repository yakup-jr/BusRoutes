spring:
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: jdbc:postgresql://localhost:5432/dev
    driver-class-name: {{ DB_DRIVER }}
    username: {{ DB_USERNAME }}
    password: {{ DB_PASSWORD }}
logging:
  level:
    org:
      hibernate:
        type: trace
      springframework:
        web: DEBUG
        jdbc:
          core:
            JdbcTemplate: DEBUG
            StatementCreatorUtils: TRACE
        transaction: DEBUG


